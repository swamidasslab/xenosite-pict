# Help rust-lld find libstdc++ (coordgen-sys / C++ on GNU/Linux).
# Wasm CoordGen is compiled with em++ (see crates/coordgen-sys/build.rs).

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-L/usr/lib/gcc/x86_64-linux-gnu/13"]

# CoordGen is C++; rustc's default emcc linker misses libc++ (`-sDEFAULT_TO_CXX`).
# MODULARIZE+EXPORT_ES6: JS factory used by js/src/native.ts.
[target.wasm32-unknown-emscripten]
linker = "em++"
rustflags = [
    "-C", "link-arg=-fwasm-exceptions",
    "-C", "link-arg=-sMODULARIZE=1",
    "-C", "link-arg=-sEXPORT_ES6=1",
    "-C", "link-arg=-sENVIRONMENT=web,node",
    "-C", "link-arg=-sALLOW_MEMORY_GROWTH=1",
    "-C", "link-arg=-sEXPORTED_FUNCTIONS=_xpict_render,_xpict_scene_to_svg,_xpict_string_free,_free",
    "-C", "link-arg=-sEXPORTED_RUNTIME_METHODS=UTF8ToString,stringToNewUTF8",
]
