# Prefer the Ubuntu 202309 FileWriters.h shim when building rdkit-sys,
# and help rust-lld find libstdc++.
[env]
CPLUS_INCLUDE_PATH = { value = "crates/xpict/compat/rdkit", relative = true, force = false }
CXX = { value = "g++", force = false }

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-L/usr/lib/gcc/x86_64-linux-gnu/13"]
