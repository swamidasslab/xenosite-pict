      targets: t0
      arrow: forward
    - type: edge
      sources: src
      targets: t1
      arrow: forward
    - type: edge
      sources: src
      targets: t2
      arrow: forward
    - type: edge
      sources: src
      targets: t3
      arrow: forward
    - type: edge
      sources: src
