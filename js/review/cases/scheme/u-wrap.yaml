title: Network wrap (8 mols)
expect: Horizontal chain of eight mols plus dashed A→H. Network path keeps the ELK corridor (above/around the row) instead of Catmull-shoving it off the page or cutting a 2-point chord through the intermediates.
spec:
  type: reaction_scheme
  layout:
    edge_routing: orthogonal
  children:
    - type: mol
      id: A
      smiles: CCO
      name: A
    - type: mol
      id: B
      smiles: CC
    - type: mol
      id: C
      smiles: C
    - type: mol
      id: D
      smiles: O
    - type: mol
      id: E
      smiles: N
    - type: mol
      id: F
      smiles: C=O
    - type: mol
      id: G
      smiles: CC=O
    - type: mol
      id: H
      smiles: c1ccccc1O
      name: H
    - type: edge
      sources: A
      targets: B
      arrow: forward
    - type: edge
      sources: B
      targets: C
      arrow: forward
    - type: edge
      sources: C
      targets: D
      arrow: forward
    - type: edge
      sources: D
      targets: E
      arrow: forward
    - type: edge
      sources: E
      targets: F
      arrow: forward
    - type: edge
      sources: F
      targets: G
      arrow: forward
    - type: edge
      sources: G
      targets: H
      arrow: forward
    - type: edge
      sources: A
      targets: H
      arrow: forward
      color: "#c40"
      dashed: true
