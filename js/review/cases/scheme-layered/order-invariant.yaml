title: Order-invariant packing
expect: Same A→B→C connectivity as a permuted child list; packing matches the canonical order case (compare visually to spacing-defaults).
spec:
  type: reaction_scheme
  children:
    - type: mol
      id: C
      smiles: CC(=O)O
      name: acetic acid
    - type: edge
      sources: B
      targets: C
      arrow: forward
    - type: mol
      id: B
      smiles: CC=O
      name: acetaldehyde
    - type: edge
      sources: A
      targets: B
      arrow: forward
    - type: mol
      id: A
      smiles: CCO
      name: ethanol
