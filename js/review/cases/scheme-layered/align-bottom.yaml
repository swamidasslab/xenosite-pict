title: Explicit bottom align
expect: Chain mols share tile bottom edges.
spec:
  type: reaction_scheme
  layout:
    align: bottom
  children:
    - type: mol
      id: A
      smiles: CCO
      name: ethanol
    - type: mol
      id: B
      smiles: c1ccccc1O
      name: phenol
    - type: edge
      sources: A
      targets: B
      arrow: forward
