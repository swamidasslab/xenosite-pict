title: Forced layer hint
expect: "Intermediate B forced to layer 0 with A (mol.layer: 0); C remains downstream."
spec:
  type: reaction_scheme
  children:
    - type: mol
      id: A
      smiles: CCO
      name: A
    - type: mol
      id: B
      smiles: CC=O
      name: B
      layer: 0
    - type: mol
      id: C
      smiles: CC(=O)O
      name: C
    - type: edge
      sources: A
      targets: B
      arrow: forward
    - type: edge
      sources: B
      targets: C
      arrow: forward
