title: Explicit top align
expect: Chain mols share tile top edges (layout.align top), not baselines.
spec:
  type: reaction_scheme
  layout:
    align: top
  children:
    - type: mol
      id: A
      smiles: CCO
      name: ethanol
    - type: mol
      id: B
      smiles: c1ccccc1O
      name: phenol
    - type: edge
      sources: A
      targets: B
      arrow: forward
