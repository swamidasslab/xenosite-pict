[package]
name = "xpict"
version = "0.9.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Declarative molecule depiction for publication-quality vector graphics (Rust; also Python and JS)"
readme = "README.md"
documentation = "https://docs.rs/xpict"
keywords = ["chemistry", "molecule", "svg", "depiction", "smiles"]
categories = ["science", "visualization"]

[lib]
name = "xpict"
path = "src/lib.rs"

[dependencies]
thiserror = "1"
xpict-core = { path = "../xpict-core", version = "0.9.0" }

[features]
default = ["pdf", "png"]
# Scene → vector PDF (svg2pdf).
pdf = ["xpict-core/pdf"]
# Scene → PNG raster (resvg, bundled font).
png = ["xpict-core/png"]

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
