[package]
name = "xpict"
version = "0.1.4"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Public Rust molecule depiction API (RDKit layout + xpict-core paint)"
readme = "README.md"
keywords = ["chemistry", "molecule", "svg", "rdkit", "depiction"]
categories = ["science", "visualization"]

[lib]
name = "xpict"
path = "src/lib.rs"

[dependencies]
cxx = "1"
rdkit = "0.4.12"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
xpict-core = { path = "../xpict-core", version = "0.1.4" }

[build-dependencies]
cxx-build = "1"

# cxx + RDKit FFI need `unsafe`; keep the forbid on xpict-core / py / wasm.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
