[package]
name = "xpict-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Shared depiction core for xpict (metrics, plotdots, bond geometry) — Python lab ports here, then PyO3 + WASM"
readme = "README.md"

[lib]
name = "xpict_core"
path = "src/lib.rs"
crate-type = ["rlib"]

[features]
default = ["elk"]
# Diagram placement via native ELK (drops Python jsrun + vendored elkjs).
elk = ["dep:elkrs"]
# Keep the core free of FFI so algorithms stay testable in pure Rust.

[dependencies]
# Fonts / geometry land behind optional crates (ttf-parser, geo / i_overlay)
# when those modules move over.
elkrs = { version = "0.1.1", optional = true }

[dev-dependencies]

[lints]
workspace = true
