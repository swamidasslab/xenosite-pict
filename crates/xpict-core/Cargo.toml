[package]
name = "xpict-core"
version = "0.3.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Shared paint core for xpict — declarative molecule depiction as publication-quality SVG"
readme = "README.md"
documentation = "https://docs.rs/xpict-core"
keywords = ["chemistry", "molecule", "svg", "depiction", "wasm"]
categories = ["science", "visualization"]

[lib]
name = "xpict_core"
path = "src/lib.rs"
crate-type = ["rlib"]

[features]
default = ["elk", "geom", "font"]
# Diagram placement via native ELK (drops Python jsrun + vendored elkjs).
elk = ["dep:elkrs"]
# Polygon buffer / boolean ops (drops Python Shapely).
geom = ["dep:i_overlay"]
# Liberation Sans outlines / advances (drops Python fontTools).
font = ["dep:ttf-parser", "geom"]
# Export live JSON Schema (schemars) + TypeScript (ts-rs). Dev/CI only —
# not on the crates.io default feature set.
codegen = ["dep:schemars", "dep:ts-rs"]

[dependencies]
elkrs = { version = "0.1.1", optional = true }
i_overlay = { version = "9.0.0", optional = true }
ttf-parser = { version = "0.25", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "0.8", optional = true }
ts-rs = { version = "10", optional = true, features = ["serde-compat"] }

[dev-dependencies]

[[example]]
name = "export_live_schema"
required-features = ["codegen"]

[lints]
workspace = true
