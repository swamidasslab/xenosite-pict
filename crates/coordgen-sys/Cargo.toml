[package]
name = "coordgen-sys"
version = "0.3.0"
edition.workspace = true
license = "MIT AND BSD-3-Clause"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false
description = "Static Schrödinger CoordGen FFI + safe Rust layout wrapper (private)"

[lib]
name = "coordgen_sys"
path = "src/lib.rs"

[dependencies]
thiserror = "1"

[build-dependencies]
cc = "1"

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
