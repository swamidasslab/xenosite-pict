[package]
name = "xpict-wasm"
version = "0.5.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Emscripten bindings for xpict-core (browser / Node)"

[lib]
name = "xpict_wasm"

[[bin]]
name = "xpict_wasm"
path = "src/main.rs"

[dependencies]
serde_json = "1"
# CoordGen, Chematic, ELK, and font are always linked (same engine as Python).
xpict-core = { path = "../xpict-core", features = ["font"] }

[lints.rust]
# C string ABI for emscripten (`xpict_render` / `xpict_string_free`).
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
