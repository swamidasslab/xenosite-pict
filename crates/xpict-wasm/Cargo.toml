[package]
name = "xpict-wasm"
version = "0.5.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "wasm-bindgen bindings for xpict-core (browser / Node)"

[lib]
name = "xpict_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde_json = "1"
# CoordGen, Chematic, ELK, and font are always linked (same engine as Python).
xpict-core = { path = "../xpict-core", features = ["font"] }

# canonaut → rand → getrandom: browsers need the JS (crypto) backend, plus the
# `getrandom_backend` cfg in .cargo/config.toml.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[lints]
workspace = true

# Newer rustc emits bulk-memory / saturating float ops; default wasm-opt
# (binaryen 117 via wasm-pack) rejects them unless features are enabled.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--all-features"]
