[package]
name = "xpict-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "wasm-bindgen bindings for xpict-core (browser / Node)"

[lib]
name = "xpict_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde_json = "1"
# Diagram ELK stays on npm elkjs for now — enabling core `elk` balloons the
# wasm to ~2.8 MB. Python already uses elkrs via xpict-py.
xpict-core = { path = "../xpict-core", default-features = false }

[lints]
workspace = true
