[package]
name = "xpict-py"
version = "0.3.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "PyO3 bindings for xpict-core"

[lib]
name = "xpict_native"
crate-type = ["cdylib"]

[dependencies]
# abi3-py311 → one wheel per OS/arch for all CPython ≥3.11 (matches requires-python).
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py311"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xpict-core = { path = "../xpict-core" }

[lints]
workspace = true
