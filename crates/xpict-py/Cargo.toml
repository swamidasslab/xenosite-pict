[package]
name = "xpict-py"
version = "0.1.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "PyO3 bindings for xpict-core"

[lib]
name = "xpict_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
serde_json = "1"
xpict-core = { path = "../xpict-core" }

[lints]
workspace = true
