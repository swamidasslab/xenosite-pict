[workspace]
resolver = "2"
members = [
    "crates/coordgen-sys",
    "crates/xpict-core",
    "crates/xpict-py",
    "crates/xpict-wasm",
    "crates/xpict",
]
# Coverage stays on xpict-core; `cargo test` covers the public crate too.
default-members = ["crates/xpict-core", "crates/xpict"]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["S. Joshua Swamidass <swamidass@gmail.com>"]
repository = "https://github.com/swamidasslab/xenosite-pict"
homepage = "https://swamidasslab.github.io/xenosite-pict/"
# Current stable toolchain (CoordGen FFI + edition 2024 crates).
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Compact release binaries for PyO3 wheels + wasm (debug symbols + unused
# std dominate without this — manylinux .so was ~8.4 MB uncompressed).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# canonaut 1.0.0 assumes 64-bit words (hardcoded 64/63/>>6), so graphs over 32 vertices panic on
# wasm32. vendor/canonaut is 1.0.0 with those derived from usize::BITS (same copy as xenobase's
# wasm/vendor); drop it once upstream (github.com/um-univie/canonaut) is fixed.
[patch.crates-io]
canonaut = { path = "vendor/canonaut" }
