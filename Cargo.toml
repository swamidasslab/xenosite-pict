[workspace]
resolver = "2"
# xpict (RDKit-backed public API) is a member but not a default-member so
# `cargo test` / CI coverage on xpict-core does not require system RDKit.
members = [
    "crates/xpict-core",
    "crates/xpict-py",
    "crates/xpict-wasm",
    "crates/xpict",
]
default-members = ["crates/xpict-core"]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["S. Joshua Swamidass <swamidass@gmail.com>"]
repository = "https://github.com/swamidasslab/xenosite-pict"
homepage = "https://swamidasslab.github.io/xenosite-pict/"
# chematic 1.0.27 requires rustc ≥ 1.88 (edition2024 crates).
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Compact release binaries for PyO3 wheels + wasm (debug symbols + unused
# std dominate without this — manylinux .so was ~8.4 MB uncompressed).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
