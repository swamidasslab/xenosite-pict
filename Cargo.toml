[workspace]
resolver = "2"
# xpict (RDKit-backed public API) is a member but not a default-member so
# `cargo test` / CI coverage on xpict-core does not require system RDKit.
members = [
    "crates/xpict-core",
    "crates/xpict-py",
    "crates/xpict-wasm",
    "crates/xpict",
]
default-members = ["crates/xpict-core"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/swamidasslab/xenosite-pict"
# elkrs → indexmap 2.14 needs edition2024 (stable since 1.85).
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
