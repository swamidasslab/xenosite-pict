# Publish xpict to PyPI via Trusted Publishing (OIDC).
#
# Triggers:
#   - tag py/v*  (e.g. py/v0.1.5) → builds wheels + sdist, publishes
#   - workflow_dispatch → same, optional dry_run
#   - release.yml dispatches this workflow on product release/v* (major/minor)
#
# Wheels: Linux (x86_64, aarch64), macOS (x86_64, aarch64), Windows (x64, aarch64).
# abi3-py311 → one wheel per platform for CPython ≥3.11.
#
# PyPI Trusted Publisher: workflow pypi.yml, environment pypi.
# Do not set MATURIN_PYPI_TOKEN — an empty token breaks OIDC.
#
# Package name: xpict (source under python/xpict/, not under xenosite).

name: pypi

on:
  push:
    tags:
      - "py/v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only (do not publish)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  prepare:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/py/v')
        run: |
          VER="${GITHUB_REF_NAME#py/v}"
          echo "Publishing version $VER"
          bash scripts/check_version_policy.sh --patch-only "$VER"
          python3 - <<PY
          from pathlib import Path
          import re
          ver = "${VER}"
          p = Path("pyproject.toml")
          text = p.read_text()
          text, n = re.subn(
              r'(?m)^version = "[^"]+"',
              f'version = "{ver}"',
              text,
              count=1,
          )
          assert n == 1, "pyproject version line not found"
          p.write_text(text)
          for name in ("xpict-py", "xpict-core"):
              cp = Path(f"crates/{name}/Cargo.toml")
              t = cp.read_text()
              t, n = re.subn(r'(?m)^version = "[^"]+"', f'version = "{ver}"', t, count=1)
              assert n == 1, cp
              cp.write_text(t)
          PY

      - name: Version policy (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          VER="$(python3 -c "import re; from pathlib import Path; print(re.search(r'(?m)^version = \"([^\"]+)\"', Path('pyproject.toml').read_text()).group(1))")"
          bash scripts/check_version_policy.sh "$VER"

      - name: Upload version tree
        uses: actions/upload-artifact@v4
        with:
          name: py-version-tree
          path: |
            pyproject.toml
            crates/xpict-py/Cargo.toml
            crates/xpict-core/Cargo.toml

  wheels:
    needs: prepare
    uses: ./.github/workflows/build-python-wheels.yml
    with:
      version_tree_artifact: py-version-tree

  publish:
    needs: wheels
    runs-on: ubuntu-latest
    environment: pypi
    # Trusted Publishing (OIDC). Do not set MATURIN_PYPI_TOKEN — an empty
    # token forces password auth and breaks OIDC.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download wheels + sdist
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: List artifacts
        run: ls -la dist

      - name: Publish to PyPI (Trusted Publishing)
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --skip-existing dist/*

      - name: Dry-run note
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: echo dry_run skipped PyPI publish
