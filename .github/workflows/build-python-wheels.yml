# Build abi3 wheels + sdist for PyPI (called by pypi.yml / release.yml).
#
# Platforms:
#   Linux   x86_64, aarch64  (manylinux)
#   macOS   x86_64 (macos-15-intel), aarch64 (macos-latest)
#   Windows x64, aarch64 (windows-11-arm)
#
# Optional input `version_tree_artifact`: artifact with version-bumped
# pyproject.toml + crates/*/Cargo.toml (release.yml). Empty = use checkout as-is.

name: build-python-wheels

on:
  workflow_call:
    inputs:
      version_tree_artifact:
        description: "Artifact with version-bumped Python/Rust package files"
        type: string
        required: false
        default: ""

jobs:
  linux:
    name: wheel linux ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: Apply version tree
        if: inputs.version_tree_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.version_tree_artifact }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  macos:
    name: wheel macos ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Apply version tree
        if: inputs.version_tree_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.version_tree_artifact }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    name: wheel windows ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x64
            python_arch: x64
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Apply version tree
        if: inputs.version_tree_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.version_tree_artifact }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply version tree
        if: inputs.version_tree_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.version_tree_artifact }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist
