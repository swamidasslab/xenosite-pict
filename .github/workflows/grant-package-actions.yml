# GITHUB_TOKEN of a consuming repo cannot read this private package until the
# repo is listed under Package settings → Manage Actions access. The publishing
# repo's token has admin on the package; this job grants read to xenobase.
#
# Do not look up the consumer repo via the API: xenobase is private and this
# token is scoped to xenosite-pict. Pass the numeric repository id instead.
name: Grant package Actions access

on:
  workflow_dispatch:
    inputs:
      repository_id:
        description: "Numeric GitHub repository id (gh api repos/OWNER/NAME --jq .id)"
        default: "1434833912"
        type: string
      repository:
        description: "owner/name, for the log only"
        default: swamidasslab/xenobase
        type: string

permissions:
  packages: write
  contents: read

jobs:
  grant:
    runs-on: ubuntu-latest
    steps:
      - name: Grant Actions read on @swamidasslab/xpict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RID: ${{ inputs.repository_id }}
          REPO: ${{ inputs.repository }}
        run: |
          set -euo pipefail
          echo "Granting ${REPO} (id ${RID}) read on npm/xpict"
          gh api orgs/swamidasslab/packages/npm/xpict --jq '{name,visibility,repository:.repository.full_name}'
          # Empty PUT is what the docs show; permission=read is accepted by some registries.
          if gh api --method PUT "orgs/swamidasslab/packages/npm/xpict/actions/permissions/repositories/${RID}"; then
            echo "granted (empty body)"
          elif gh api --method PUT "orgs/swamidasslab/packages/npm/xpict/actions/permissions/repositories/${RID}" -f permission=read; then
            echo "granted (permission=read)"
          else
            echo "PUT repositories/${RID} failed; trying policy=selected then retry"
            gh api --method PUT orgs/swamidasslab/packages/npm/xpict/actions/permissions -f policy=selected || true
            gh api --method PUT "orgs/swamidasslab/packages/npm/xpict/actions/permissions/repositories/${RID}"
          fi
          gh api orgs/swamidasslab/packages/npm/xpict/actions/permissions/repositories --jq '.repositories[]?.full_name'
