# Publish @xenosite/xpict to the public npm registry (npmjs.org).
#
# Triggers:
#   - tag js/v*  (e.g. js/v0.1.1) → sets version from tag and publishes
#   - workflow_dispatch → package.json version; default is **stage** (pack only)
#
# Stage (no registry write): Actions → Publish JS package → Run workflow with
# dry_run checked. Builds, tests, `npm pack`, uploads the tarball artifact.
# Does not need NPM_TOKEN.
#
# One-time for real publish: npmjs.org org/user owns scope @xenosite; environment
# secret NPM_TOKEN on the `npm` GitHub Environment (Automation token). Consumers:
# npm install @xenosite/xpict (no .npmrc).
#
# Gated on CI (Rust test+coverage, strict tsc, pyright, pytest).

name: Publish JS package

on:
  push:
    tags:
      - "js/v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Stage only — build + npm pack (do not publish)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-js-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    # Skip npm env (and NPM_TOKEN) when staging via workflow_dispatch.
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && fromJSON('null') || 'npm' }}
    defaults:
      run:
        working-directory: js
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          scope: "@xenosite"
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install JS deps
        run: npm ci

      - name: Strict TypeScript check
        run: npm run check

      - name: Build wasm + TypeScript
        run: npm run build

      - name: Test
        run: npm test

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/js/v')
        run: |
          VER="${GITHUB_REF_NAME#js/v}"
          echo "Publishing version $VER"
          bash ../scripts/check_version_policy.sh --patch-only "$VER"
          npm version "$VER" --no-git-tag-version --allow-same-version

      - name: Version policy (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: bash ../scripts/check_version_policy.sh "$(node -p "require('./package.json').version")"

      - name: Stage — npm pack
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        id: pack
        run: |
          TGZ="$(npm pack --json | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8"))[0].filename')"
          echo "tarball=$TGZ" >> "$GITHUB_OUTPUT"
          ls -la "$TGZ"
          npm publish --dry-run --access public

      - name: Upload staged tarball
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: npm-stage-${{ github.run_id }}
          path: js/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

      - name: Publish to npmjs.org
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        run: |
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "NPM_TOKEN secret required (npm Automation token with publish rights for @xenosite)" >&2
            exit 1
          fi
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
