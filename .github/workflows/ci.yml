# Deploy gates: Rust tests/coverage first; JS and Python both need it.
#
# Rust:   cargo test + llvm-cov on xpict-core (≥97% lines; push to 100%)
# JS:     tsc --strict
# Python: pytest + RDKit on 3.11–3.13 (Linux) and native-smoke (macOS/Windows);
#         pyright on every Linux Python job
# RDKit:  required for layout (experimental native layout removed)
# PyPI wheels (all arches): see build-python-wheels.yml / pypi.yml / release.yml

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust test + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: rust-cov

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: cargo test -p xpict-core
        run: cargo test -p xpict-core

      - name: Version policy (major.minor lockstep)
        run: bash scripts/check_version_policy.sh

      - name: llvm-cov (line floor)
        run: |
          cargo llvm-cov -p xpict-core --lcov --output-path lcov.info \
            --fail-under-lines "${RUST_COV_MIN}"
        env:
          # Remaining misses are mostly Liberation TTF dead arms / defensive joins.
          RUST_COV_MIN: "97"

      - name: Upload lcov
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xpict-core-lcov
          path: lcov.info

  js:
    name: JS strict tsc + smoke
    needs: [rust]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install JS deps
        run: npm ci

      - name: Strict TypeScript check
        run: npm run check

      - name: Strict TypeScript check (pocs)
        run: npm run check:pocs

      - name: Build wasm + TypeScript
        run: npm run build

      - name: API smoke
        run: npm run test:api

  python-test:
    name: Python pytest ${{ matrix.python-version }} + rdkit + pyright
    needs: [rust]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: py-${{ matrix.python-version }}-rdkit

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync Python deps (dev + rdkit)
        run: uv sync --group dev --extra rdkit

      - name: Confirm RDKit import
        run: uv run python -c "import rdkit; print('rdkit', rdkit.__version__)"

      - name: Strict pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest -q

  # abi3 extension + full pytest (incl. RDKit layout) on Apple Silicon + Windows.
  python-native-smoke:
    name: Python native smoke (${{ matrix.os }})
    needs: [rust]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: py-smoke-${{ matrix.os }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync Python deps (dev + rdkit)
        run: uv sync --group dev --extra rdkit

      - name: Confirm RDKit import
        run: uv run python -c "import rdkit; print('rdkit', rdkit.__version__)"

      - name: Pytest
        run: uv run pytest -q
