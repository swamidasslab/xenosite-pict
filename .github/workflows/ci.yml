# Deploy gates: Rust tests/coverage first; JS and Python both need it.
#
# Rust:   cargo test + llvm-cov on xpict-core (≥93% lines; raise toward 97%)
# JS:     tsc --strict
# Python: pytest on 3.11–3.13 (Linux) and native-smoke (macOS/Windows);
#         pyright on every Linux Python job
# PyPI wheels (all arches): see build-python-wheels.yml / pypi.yml / release.yml

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust test + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: rust-cov

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: cargo test -p xpict-core -p xpict
        run: make test-rust

      - name: Version policy (major.minor lockstep)
        run: make check-versions

      - name: Live types drift (schemars + ts-rs)
        run: make types-check

      - name: llvm-cov (line floor)
        # Floor is current crate coverage after align/chrome/spokes landed.
        # Biggest remaining holes: caption, chrome_paint, layout_constraints.
        run: make cov-lcov
        env:
          RUST_COV_MIN: "93"

      - name: Upload lcov
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xpict-core-lcov
          path: lcov.info

  js:
    name: JS strict tsc + smoke
    needs: [rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (wasm32-unknown-emscripten)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install emsdk (CoordGen C++)
        run: |
          bash scripts/ensure_emsdk.sh
          EMSDK_ROOT="${XDG_CACHE_HOME:-$HOME/.cache}/emsdk"
          echo "EMSDK=$EMSDK_ROOT" >> "$GITHUB_ENV"
          echo "$EMSDK_ROOT" >> "$GITHUB_PATH"
          echo "$EMSDK_ROOT/upstream/emscripten" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install JS deps
        run: make js-deps

      - name: Strict check + build + API smoke
        run: make js-ci

  python-test:
    name: Python pytest ${{ matrix.python-version }} + pyright
    needs: [rust]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: py-${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync Python deps
        run: make sync

      - name: Strict pyright
        run: make check-pyright

      - name: Pytest
        run: make test-python

  # abi3 extension + full pytest on Apple Silicon + Windows.
  # Windows runners often lack GNU make — keep direct commands there.
  python-native-smoke:
    name: Python native smoke (${{ matrix.os }})
    needs: [rust]
    runs-on: ${{ matrix.os }}
    # Windows maturin currently dies linking coordgen (`stdc++.lib`). Don't block
    # JS GitHub Packages publish on that; Linux/macOS still gate.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: py-smoke-${{ matrix.os }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync Python deps
        # Direct uv (this matrix includes windows-latest; pwsh ≠ bash `make`).
        run: uv sync --group dev

      - name: Pytest
        run: uv run pytest -q
