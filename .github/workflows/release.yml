# All-or-none product release (major/minor, or coordinated same version).
#
# Triggers:
#   - tag release/v*  (e.g. release/v0.2.0) → publish core, rust, js
#   - workflow_dispatch → version + optional dry_run
#
# Python → separate pypi.yml (Trusted Publishing: pypi.yml + env pypi).
# Language-only tags (js/v*, py/v*, …) cannot ship X.Y.0 — see .github/PUBLISH.md.

name: release

on:
  push:
    tags:
      - "release/v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver to publish on every surface (e.g. 0.2.0)"
        required: true
        type: string
      dry_run:
        description: "Build / dry-run only (do not publish)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  meta:
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      dry_run: ${{ steps.v.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [[ "${GITHUB_REF_NAME:-}" == release/v* ]]; then
            VER="${GITHUB_REF_NAME#release/v}"
            DRY=false
          else
            VER="${{ inputs.version }}"
            DRY="${{ inputs.dry_run }}"
          fi
          bash scripts/check_version_policy.sh --product "$VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY" >> "$GITHUB_OUTPUT"
          echo "Product release $VER (dry_run=$DRY)"

  bump:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set all package versions to ${{ needs.meta.outputs.version }}
        run: python3 scripts/bump_version.py "${{ needs.meta.outputs.version }}"
      - name: Upload versioned tree
        uses: actions/upload-artifact@v4
        with:
          name: release-tree
          path: |
            js/package.json
            js/package-lock.json
            pyproject.toml
            python/xpict/__init__.py
            crates/xpict-core/Cargo.toml
            crates/xpict/Cargo.toml
            crates/xpict-py/Cargo.toml
            crates/xpict-wasm/Cargo.toml

  publish-core:
    needs: [meta, bump]
    runs-on: ubuntu-latest
    environment: crates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-tree
          path: .
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Publish xpict-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY: ${{ needs.meta.outputs.dry_run }}
        run: |
          if [[ "$DRY" == "true" ]]; then
            cargo publish -p xpict-core --dry-run --allow-dirty
          else
            test -n "${CARGO_REGISTRY_TOKEN:-}" || { echo "CARGO_REGISTRY_TOKEN required" >&2; exit 1; }
            cargo publish -p xpict-core --allow-dirty
          fi

      - name: Wait for crates.io to index xpict-core
        if: needs.meta.outputs.dry_run != 'true'
        run: |
          VER="${{ needs.meta.outputs.version }}"
          for i in $(seq 1 30); do
            if curl -fsSL -A "xpict-release" \
              "https://crates.io/api/v1/crates/xpict-core/$VER" >/dev/null 2>&1; then
              echo "xpict-core@$VER visible on crates.io"
              exit 0
            fi
            echo "waiting for xpict-core@$VER ($i/30)…"
            sleep 10
          done
          echo "warning: xpict-core@$VER not visible yet; publish-rust may retry/fail" >&2

  publish-rust:
    needs: [meta, bump, publish-core]
    runs-on: ubuntu-latest
    environment: crates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-tree
          path: .
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install RDKit
        run: |
          sudo apt-get update
          sudo apt-get install -y librdkit-dev librdkit1 libboost-all-dev g++
      - name: Publish xpict
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CPLUS_INCLUDE_PATH: ${{ github.workspace }}/crates/xpict/compat/rdkit
          DRY: ${{ needs.meta.outputs.dry_run }}
        run: |
          if [[ "$DRY" == "true" ]]; then
            cargo publish -p xpict --dry-run --allow-dirty
          else
            test -n "${CARGO_REGISTRY_TOKEN:-}" || { echo "CARGO_REGISTRY_TOKEN required" >&2; exit 1; }
            cargo publish -p xpict --allow-dirty
          fi

  publish-js:
    needs: [meta, bump]
    runs-on: ubuntu-latest
    # Temporary: GitHub Packages (@swamidasslab/xpict). npmjs OIDC later.
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-tree
          path: .
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@swamidasslab"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - name: Retarget package name for GitHub Packages
        run: |
          npm pkg set name=@swamidasslab/xpict
          npm pkg set publishConfig.registry=https://npm.pkg.github.com
          npm pkg set publishConfig.access=public
      - name: Publish JS
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY: ${{ needs.meta.outputs.dry_run }}
        run: |
          if [[ "$DRY" == "true" ]]; then
            npm pack
          else
            npm publish
          fi

  # Python wheels + PyPI upload live in pypi.yml (Trusted Publishing is
  # registered for workflow `pypi.yml` + environment `pypi` only — not here).
  # After a product `release/v*`, dispatch pypi.yml (or tag py/v* for patches).
