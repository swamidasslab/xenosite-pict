[project]
name = "xpict"
version = "0.6.0"
description = "Declarative molecule depiction for publication-quality vector graphics (Python; also Rust and JS)"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "S. Joshua Swamidass", email = "swamidass@gmail.com" },
]
requires-python = ">=3.11,<3.14"
keywords = [
  "chemistry",
  "molecule",
  "depiction",
  "svg",
  "smiles",
  "xenosite",
]
dependencies = [
  "pydantic>=2.7",
  "typing_extensions>=4.12",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
# SMILES parse for Python mol()/render() until the native bridge lands.
chematic = ["chematic>=1.0"]
all = ["xpict[chematic]"]

[project.urls]
Homepage = "https://swamidasslab.github.io/xenosite-pict/"
Documentation = "https://swamidasslab.github.io/xenosite-pict/"
Repository = "https://github.com/swamidasslab/xenosite-pict"
Issues = "https://github.com/swamidasslab/xenosite-pict/issues"
Changelog = "https://github.com/swamidasslab/xenosite-pict/releases"
"Future PictSpec" = "https://github.com/swamidasslab/xenosite-pict/tree/main/python/xpict/future"

[project.scripts]
xpict-export-schema = "xpict.export_schema:main"

[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/xpict-py/Cargo.toml"
python-source = "python"
module-name = "xpict._native"
include = ["schema/**", "js/**", "docs/**"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "maturin>=1.4,<2.0",
  "pyright>=1.1.414",
  "coverage>=7.16.2",
  "vulture>=2.16",
  "basedpyright>=1.40.2",
  "ipykernel>=7.4.0",
  "xenosite-forest>=0.10",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5,<10",
  "mkdocstrings[python]>=0.26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python", "tests"]

[tool.ruff]
line-length = 100
# Minimum supported; CI matrix covers 3.11–3.13 (3.14 blocked on PyO3).
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

# basedpyright only (cannot coexist with [tool.pyright]).
[tool.basedpyright]
include = ["python/xpict"]
exclude = [
  "python/xpict/future",
  "python/xpict/export_schema.py",
  "python/xpict/api.py",
  "**/__pycache__",
]
# Typecheck against the oldest supported runtime.
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
failOnWarnings = false
# Gradual typing on generated / dynamic edges; ban explicit Any.
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportMissingTypeStubs = false
reportMissingParameterType = false
reportAny = false
reportExplicitAny = "error"
reportImplicitStringConcatenation = false
reportImplicitOverride = false
reportUnannotatedClassAttribute = false
reportUnnecessaryIsInstance = false
