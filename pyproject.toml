[project]
name = "xpict"
version = "0.1.0"
description = "Declarative, publication-quality small-molecule depiction for Python and the web"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "S. Joshua Swamidass", email = "swamidass@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "jsrun>=0.1.0",
  "shapely>=2.1.2",
  "fonttools>=4.65.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
# Alternate 2D layout backend (native is default).
indigo = [
    "epam-indigo>=1.19",
]
# Template alignment only — not a layout backend. Absent ⇒ rigid rotate/translate.
rdkit = ["rdkit>=2024.3"]
all = ["xpict[indigo,rdkit]"]

[project.urls]
Homepage = "https://github.com/swamidasslab/xenosite-pict"
Repository = "https://github.com/swamidasslab/xenosite-pict"

[project.scripts]
xpict-export-schema = "xpict.export_schema:main"

[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/xpict-py/Cargo.toml"
python-source = "src"
module-name = "xpict._native"
include = ["schema/**", "js/**", "docs/**"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "maturin>=1.4,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
