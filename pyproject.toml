[project]
name = "xpict"
version = "0.1.4"
description = "Declarative, publication-quality small-molecule depiction for Python and the web"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "S. Joshua Swamidass", email = "swamidass@gmail.com" },
]
requires-python = ">=3.11,<3.15"
dependencies = [
  "pydantic>=2.7",
  "typing_extensions>=4.12",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
# Preferred 2D layout + template alignment (Python). JS uses @rdkit/rdkit separately.
rdkit = ["rdkit>=2024.3"]
# Alternate 2D layout; pair with rigid/fake align in Rust (no RDKit template).
indigo = [
    "epam-indigo>=1.19",
]
all = ["xpict[rdkit,indigo]"]

[project.urls]
Homepage = "https://github.com/swamidasslab/xenosite-pict"
Repository = "https://github.com/swamidasslab/xenosite-pict"

[project.scripts]
xpict-export-schema = "xpict.export_schema:main"

[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/xpict-py/Cargo.toml"
python-source = "src"
module-name = "xpict._native"
include = ["schema/**", "js/**", "docs/**"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "maturin>=1.4,<2.0",
  "pyright>=1.1.414",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
# Minimum supported; CI matrix covers 3.11–3.14.
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pyright]
include = ["src"]
# Typecheck against the oldest supported runtime.
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
# Untyped chem deps (rdkit/indigo) and gradual typing: keep other strict rules.
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportMissingTypeStubs = false
reportMissingParameterType = false
